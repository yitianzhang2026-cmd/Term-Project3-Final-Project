name: Deploy ContractGuardian Backend to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check backend files
        run: |
          echo "Backend directory:"
          ls -la contract-guardian/backend
          echo "Requirements:"
          cat contract-guardian/backend/requirements.txt

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_954FE6B972A34F5F84F0F5C66ABFAB8B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_55999017EF474498B8E218BD6FC06E7B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AE96F8B1634340A68279A45EE85402EF }}

      - name: Configure Azure Python App
        run: |
          az webapp config set \
            --resource-group contractguardian-rg \
            --name Contract-guardian \
            --linux-fx-version "PYTHON|3.12"

          az webapp config appsettings set \
            --resource-group contractguardian-rg \
            --name Contract-guardian \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true

          az webapp config set \
            --resource-group contractguardian-rg \
            --name Contract-guardian \
            --startup-file 'gunicorn --bind=0.0.0.0:8000 "app:create_app()"'

      - name: Deploy Flask backend
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Contract-guardian'
          slot-name: 'Production'
          package: './contract-guardian/backend'
